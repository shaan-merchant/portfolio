<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18703f"/><stop offset="1" stop-color="#0f4f2c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#g)"/>
  <g fill="#052a14" stroke="#c98a4b" stroke-width="5">
    <circle cx="28" cy="28" r="9"/><circle cx="772" cy="28" r="9"/><circle cx="28" cy="472" r="9"/><circle cx="772" cy="472" r="9"/>
  </g>
  <g fill="none" stroke="#eef1f8" stroke-linecap="round" stroke-linejoin="round" opacity="0.88" transform="translate(149 62) scale(4.4)">
    <g stroke-width="1.1">
      <!-- mount plate and yaw motor -->
      <rect x="30" y="2" width="40" height="6" rx="2"/>
      <rect x="43" y="8" width="14" height="9" rx="2.5"/>
      <!-- yaw to roll bracket -->
      <path d="M50 17v5h34v12"/>
      <!-- roll motor (through hole) -->
      <circle cx="84" cy="40" r="6"/><circle cx="84" cy="40" r="2"/>
      <!-- roll arm wrapping under the camera to the pitch motor -->
      <path d="M84 46v24H30V57"/>
      <!-- pitch motor (through hole) -->
      <circle cx="30" cy="51" r="6"/><circle cx="30" cy="51" r="2"/>
      <!-- camera -->
      <rect x="38" y="41" width="32" height="21" rx="3"/>
      <circle cx="54" cy="51.5" r="6"/><circle cx="54" cy="51.5" r="2.8"/>
      <!-- yaw rotation arrow -->
      <path d="M36 13.5a14 4 0 0 0 28 0"/><path d="M61.5 16.5l2.5-3 1 3.6"/>
    </g>
    <!-- internal cable route -->
    <path d="M50 4v15h32v17M84 46v22H32v-11" stroke="#c98a4b" stroke-width="0.8" stroke-dasharray="1.6 1.6"/>
  </g>
  <text x="400" y="458" text-anchor="middle" font-family="monospace" font-size="20" letter-spacing="5" fill="#eef1f8" opacity="0.7">3-AXIS GIMBAL · IN DEVELOPMENT</text>
</svg>
